<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Swedbank</title>
<style>
  :root{
    --bg:#0e0e0f; --card:#1c1c1e; --divider:#39393b;
    --teal-circle:#1d4c57; --teal-icon:#79b6c2; --teal-pill:#1d4c57; --teal-pill-text:#7fbccb;
    --orange:#ef5f24; --orange-card1:#f26a26; --orange-card2:#e9531a; --oak:#c9430f;
    --text:#f4f4f5; --text-dim:#8a8a8e; --nav-inactive:#c9c9cc;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#000;height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex;justify-content:center;color:var(--text);-webkit-font-smoothing:antialiased;
  }

  .phone{width:100%;max-width:430px;height:100%;background:var(--bg);position:relative;overflow:hidden}

  .view{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg)}
  .view.hidden{display:none}
  .scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}

  .wave{position:absolute;top:0;left:0;width:100%;height:230px;z-index:0;pointer-events:none}
  .content{position:relative;z-index:1;padding-bottom:16px}

  /* status bar */
  .statusbar{display:flex;justify-content:space-between;align-items:center;padding:14px 26px 2px;font-weight:600;font-size:19px}
  .statusbar .time{display:flex;align-items:center;gap:6px}
  .statusbar .right{display:flex;align-items:center;gap:7px}
  .bankid{padding:0 26px 4px;font-size:17px;font-weight:600;display:flex;align-items:center;gap:2px;color:#fff}

  /* quick actions */
  .actions{display:flex;justify-content:center;gap:34px;padding:34px 20px 18px}
  .action{display:flex;flex-direction:column;align-items:center;gap:14px;width:96px;cursor:pointer}
  .action .circle{width:96px;height:96px;border-radius:50%;background:var(--teal-circle);display:flex;align-items:center;justify-content:center}
  .action .label{font-size:17px;font-weight:600;text-align:center;line-height:1.25}

  .heading{display:flex;align-items:center;gap:6px;color:var(--orange);font-size:30px;font-weight:800;padding:16px 22px 12px}

  /* accounts */
  .accounts{margin:0 16px;background:var(--card);border-radius:18px;padding:4px 20px}
  .acc-row{display:flex;align-items:center;justify-content:space-between;padding:18px 0;cursor:pointer}
  .acc-row + .acc-row{border-top:1px solid var(--divider)}
  .acc-row:active{opacity:.55}
  .acc-left .name{font-size:22px;font-weight:700;margin-bottom:6px}
  .acc-left .no{font-size:16px;color:var(--text-dim);font-weight:500}
  .acc-right{display:flex;align-items:center;gap:12px}
  .acc-right .amount{font-size:22px;font-weight:800}
  .chev{color:#6a6a6e;display:flex}

  .snabb-wrap{display:flex;justify-content:flex-end;padding:16px 16px 6px}
  .snabb{background:var(--teal-pill);color:var(--teal-pill-text);border:none;font-size:21px;font-weight:700;padding:14px 26px;border-radius:26px}

  .card-wrap{display:flex;justify-content:center;padding:14px 0 4px}
  .bankcard{width:280px;height:180px;border-radius:14px;position:relative;overflow:hidden;background:linear-gradient(150deg,var(--orange-card1),var(--orange-card2));box-shadow:0 8px 22px rgba(0,0,0,.45)}
  .bankcard .seam{position:absolute;top:0;right:60px;width:1px;height:100%;background:rgba(0,0,0,.12)}
  .bankcard .oak{position:absolute;right:6px;bottom:0;width:210px;height:170px;opacity:.9}
  .bankcard .debit{position:absolute;top:16px;left:20px;font-size:15px;font-weight:600;color:#ffd9c4}
  .bankcard .chip{position:absolute;top:60px;left:22px}
  .bankcard .contact{position:absolute;top:66px;left:78px}
  .bankcard .mc{position:absolute;bottom:16px;right:20px;display:flex}
  .mc .mc-c{width:34px;height:34px;border-radius:50%}
  .mc .red{background:#eb2f36}
  .mc .yellow{background:#f6a01a;margin-left:-14px;mix-blend-mode:screen}

  .peek{color:var(--orange);font-size:30px;font-weight:800;padding:22px 22px 0;opacity:.85;display:flex;align-items:center;gap:6px}

  /* bottom nav */
  .nav{display:flex;align-items:center;justify-content:space-between;margin:0 14px 14px;padding:8px 20px;background:#161617;border:1px solid #262628;border-radius:34px}
  .nav-top{margin-top:20px}
  .nav-item{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:14px;font-weight:600;position:relative}
  .nav-item.active{color:var(--orange)}
  .nav-item.inactive{color:var(--nav-inactive)}
  .nav-item.active .pill{background:#3a2a1c;border-radius:22px;padding:8px 22px;margin-bottom:-4px}
  .nav-item .icowrap{padding:8px 0}
  .badge{position:absolute;top:-2px;right:6px;width:9px;height:9px;border-radius:50%;background:var(--orange)}

  /* back button */
  .backbtn{width:64px;height:64px;border-radius:50%;background:#2a2a2c;display:flex;align-items:center;justify-content:center;margin:14px 0 4px 22px;cursor:pointer;border:none}
  .backbtn:active{opacity:.6}

  /* loading */
  .loading-center{flex:1;display:flex;align-items:center;justify-content:center}
  .spinner{width:46px;height:46px;border-radius:50%;border:5px solid transparent;border-left-color:var(--orange);animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* detail */
  .detail-head{padding:0 22px}
  .detail-head h1{color:var(--orange);font-size:38px;font-weight:800;margin-bottom:22px}
  .lbl{color:var(--text-dim);font-size:20px;margin-bottom:2px}
  .big{font-size:30px;font-weight:800;margin-bottom:22px}
  .num{font-size:24px;font-weight:600;margin-bottom:22px}
  .detail-sep{height:1px;background:var(--divider);margin:2px 22px}
  .link-row{display:flex;align-items:center;justify-content:space-between;padding:22px;font-size:24px;cursor:pointer}
  .link-row + .link-row{border-top:1px solid var(--divider);margin:0 0}
  .sec-h{color:var(--orange);font-size:30px;font-weight:800;padding:26px 22px 6px}
  .tx{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;cursor:pointer}
  .tx + .tx{border-top:1px solid var(--divider)}
  .tx .t-name{font-size:23px;font-weight:600;margin-bottom:6px;max-width:70%}
  .tx .t-date{font-size:17px;color:var(--text-dim)}
  .tx .t-right{display:flex;align-items:center;gap:12px}
  .tx .t-amt{font-size:23px;font-weight:700;white-space:nowrap}
  .empty{color:var(--text-dim);text-align:center;font-size:20px;padding:60px 30px}
  .paybtn-wrap{position:relative;padding:0 16px}
  .paybtn{position:absolute;left:16px;right:16px;bottom:8px;background:var(--orange);color:#fff;border:none;font-size:24px;font-weight:800;padding:20px;border-radius:34px;box-shadow:0 6px 20px rgba(0,0,0,.4);cursor:pointer}
  .list-pad{padding-bottom:70px}

  /* detail topbar with centered title */
  .detail-topbar{position:relative;display:flex;align-items:center}
  .detail-topbar .backbtn{margin:14px 0 14px 22px}
  .topbar-title{position:absolute;left:80px;right:80px;top:50%;transform:translateY(-50%);text-align:center;font-size:24px;font-weight:600}

  /* investment view */
  .inv{--pie-red:#e8552a;--pie-yellow:#f2c94c;--pie-teal:#3e8ba0;--pos:#5a9fd4}
  .inv-search{display:flex;align-items:center;gap:12px;margin:6px 16px 4px;background:#242426;border-radius:16px;padding:16px 18px;color:#8a8a8e;font-size:20px}
  .inv-stats{display:grid;grid-template-columns:1fr 1fr 1fr;padding:22px 8px 8px;text-align:center;column-gap:2px}
  .inv-stats .s-lbl{color:#c9c9cc;font-size:15px}
  .inv-stats .s-val{font-size:22px;font-weight:800;margin:6px 0 16px}
  .inv-stats .s-lbl2{color:#c9c9cc;font-size:15px}
  .inv-stats .s-val2{font-size:22px;font-weight:800;margin-top:6px}
  .inv-stats .pos{color:var(--pos)}
  .inv-row{display:flex;align-items:center;justify-content:space-between;padding:20px 22px;font-size:24px}
  .inv-row .play{color:#a97b7b}
  .inv-deposit{display:flex;align-items:center;gap:16px;padding:22px 22px 6px}
  .dep-plus{width:44px;height:44px;border-radius:50%;background:var(--teal-circle);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .dep-link{color:#7fbccb;font-size:23px;font-weight:700;text-decoration:underline}
  .inv-h{font-size:32px;font-weight:800;padding:24px 22px 12px}
  .inv-card{margin:0 16px;background:var(--card);border-radius:14px;padding:26px 20px}
  .inv-chart{display:flex;align-items:center;gap:20px}
  .pie{width:150px;height:150px;border-radius:50%;flex:0 0 auto}
  .legend{display:flex;flex-direction:column;gap:16px;font-size:20px;line-height:1.25}
  .legend .dot{display:inline-block;width:13px;height:13px;border-radius:50%;margin-right:10px;vertical-align:middle}
  .legend .red{background:var(--pie-red)}
  .legend .yellow{background:var(--pie-yellow)}
  .legend .teal{background:var(--pie-teal)}
  .inv-cap{color:#8a8a8e;font-size:16px;line-height:1.4;margin-top:22px}
  .inv-tiles{display:grid;grid-template-columns:1fr 1fr;gap:2px;margin-top:22px;border-top:1px solid var(--divider)}
  .inv-tiles .tile{padding:26px 22px}
  .inv-tiles .tile + .tile{border-left:1px solid var(--divider)}
  .tile-h{font-size:28px;font-weight:800;margin-bottom:10px}
  .tile-sub{color:#8a8a8e;font-size:19px}

  /* topbar right (bell + menu) */
  .topbar-right{margin-left:auto;display:none;align-items:center;gap:18px;padding-right:22px}
  .topbar-right.on{display:flex}
  .bell{position:relative}
  .bell-badge{position:absolute;top:-8px;right:-10px;background:#c9a84a;color:#1a1a1a;font-size:15px;font-weight:700;min-width:24px;height:24px;border-radius:12px;display:flex;align-items:center;justify-content:center;padding:0 5px}

  /* stats arrow */
  .up{font-size:.85em;font-weight:700}

  /* aktier section + holdings */
  .aktier-head{display:flex;justify-content:space-between;align-items:center;background:#161617;padding:15px 22px;color:#8a8a8e;font-size:20px}
  .hold{position:relative;padding:18px 22px;border-bottom:1px solid var(--divider)}
  .hold-name{display:flex;align-items:center;gap:9px;font-size:22px;font-weight:600;margin-bottom:16px}
  .flag{width:26px;height:18px;border-radius:2px;overflow:hidden;flex:0 0 auto;display:block}
  .tick{background:#6b6a2e;color:#fff;font-weight:700;padding:2px 9px;border-radius:5px;font-size:20px}
  .hold-grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;padding-right:26px;column-gap:6px}
  .hg-l{color:#8a8a8e;font-size:15px;margin-bottom:8px}
  .hg-v{font-size:19px;font-weight:600;white-space:nowrap}
  .hg.right{text-align:right}
  .hold-chev{position:absolute;right:16px;top:62%;color:#8a8a8e;display:flex}
  .pos{color:#5a9fd4}
</style>
</head>

    aktierTotal:"2 340 590,51",
    holdings:[
      {flag:"us", tick:"SNDK", name:"SanDisk B",           idag:"+11,84", senast:"1 777,80", sedan:"+536,38", varde:"912 840,20"},
      {flag:"us", tick:"MRNA", name:"Moderna",             idag:"+4,21",  senast:"198,88",   sedan:"+399,06", varde:"623 410,15"},
      {flag:"us", tick:"DELL", name:"Dell Technologies",   idag:"+2,03",  senast:"171,45",   sedan:"+305,85", varde:"498 220,66"},
      {flag:"us", tick:"MU",   name:"Micron Technology",   idag:"+3,10",  senast:"245,60",   sedan:"+224,84", varde:"306 119,50"}
    ],
    alloc:{aktier:100, rantor:0, alt:0}, reserved:[], months:[]}
};

// build account list
const accList = document.getElementById('acc-list');
accList.innerHTML = Object.entries(accounts).map(([id,a])=>`
  <div class="acc-row" onclick="openAccount('${id}')">
    <div class="acc-left"><div class="name">${a.name}</div><div class="no">${a.no}</div></div>
    <div class="acc-right"><div class="amount">${a.amount}</div>${chev}</div>
  </div>`).join('');

function show(id){
  ['view-start','view-loading','view-detail'].forEach(v=>document.getElementById(v).classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
}
function goHome(){ show('view-start'); }

function txRow(t){
  return `<div class="tx"><div><div class="t-name">${t.n}</div><div class="t-date">${t.d}</div></div>
    <div class="t-right"><div class="t-amt">${t.a}</div>${chev}</div></div>`;
}

const flagSVG = {
  us:`<svg class="flag" viewBox="0 0 20 13" preserveAspectRatio="none"><rect width="20" height="13" fill="#fff"/><g fill="#b22234"><rect y="0" width="20" height="1.85"/><rect y="3.7" width="20" height="1.85"/><rect y="7.4" width="20" height="1.85"/><rect y="11.1" width="20" height="1.9"/></g><rect width="9" height="7" fill="#3c3b6e"/></svg>`,
  se:`<svg class="flag" viewBox="0 0 16 10" preserveAspectRatio="none"><rect width="16" height="10" fill="#006aa7"/><rect x="5" width="2" height="10" fill="#fecc00"/><rect y="4" width="16" height="2" fill="#fecc00"/></svg>`
};
const up = ` <span class="up">↗</span>`;
const chevSm = `<svg width="13" height="22" viewBox="0 0 12 20" fill="none" stroke="#8a8a8e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 2l7 8-7 8"/></svg>`;

function holdRow(h){
  return `<div class="hold">
    <div class="hold-name">${flagSVG[h.flag]||''}<span class="tick">${h.tick}</span> ${h.name}</div>
    <div class="hold-grid">
      <div class="hg"><div class="hg-l">Idag %</div><div class="hg-v pos">${h.idag}${up}</div></div>
      <div class="hg"><div class="hg-l">Senast</div><div class="hg-v">${h.senast}</div></div>
      <div class="hg"><div class="hg-l">Sedan köp %</div><div class="hg-v pos">${h.sedan}${up}</div></div>
      <div class="hg right"><div class="hg-l">Värde</div><div class="hg-v">${h.varde}</div></div>
    </div>
    <div class="hold-chev">${chevSm}</div>
  </div>`;
}

function investHTML(a){
  const al = a.alloc;
  const p1 = al.aktier, p2 = al.aktier + al.rantor;
  const pie = `background:conic-gradient(var(--pie-red) 0% ${al.aktier}%, var(--pie-yellow) ${p1}% ${p2}%, var(--pie-teal) ${p2}% 100%)`;
  const play = `<svg class="play" width="18" height="20" viewBox="0 0 12 14" fill="currentColor"><path d="M0 0l12 7-12 7z"/></svg>`;
  return `
    <div class="inv">
      <div class="inv-search">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#8a8a8e" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
        Sök aktier och fonder
      </div>

      <div class="inv-stats">
        <div class="col">
          <div class="s-lbl">Att handla för</div><div class="s-val">${a.handla}</div>
          <div class="s-lbl2">Inköpsvärde</div><div class="s-val2">${a.inkop}</div>
        </div>
        <div class="col">
          <div class="s-lbl">Utv. sedan köp</div><div class="s-val pos">${a.utv}${up}</div>
          <div class="s-lbl2">Utv. sedan köp %</div><div class="s-val2 pos">${a.utvpct}${up}</div>
        </div>
        <div class="col">
          <div class="s-lbl">Totalt värde</div><div class="s-val">${a.total}</div>
        </div>
      </div>

      <div class="detail-sep"></div>
      <div class="inv-row"><span>Dina ordrar</span>${play}</div>
      <div class="detail-sep"></div>
      <div class="inv-row"><span>Månadssparande</span>${play}</div>
      <div class="detail-sep"></div>

      <div class="inv-deposit">
        <span class="dep-plus"><svg width="22" height="22" viewBox="0 0 24 24" stroke="#7fbccb" stroke-width="2.4" stroke-linecap="round"><line x1="12" y1="6" x2="12" y2="18"/><line x1="6" y1="12" x2="18" y2="12"/></svg></span>
        <span class="dep-link">Sätt in pengar</span>
      </div>

      <div class="aktier-head"><span>Aktier</span><span>${a.aktierTotal}</span></div>
      ${a.holdings.map(holdRow).join('')}

      <h2 class="inv-h">Tillgångsfördelning</h2>
      <div class="inv-card">
        <div class="inv-chart">
          <div class="pie" style="${pie}"></div>
          <div class="legend">
            <div><span class="dot red"></span>Aktieplaceringar<br>${al.aktier} %</div>
            <div><span class="dot yellow"></span>Ränteplaceringar<br>${al.rantor} %</div>
            <div><span class="dot teal"></span>Alternativa placeringar<br>${al.alt} %</div>
          </div>
        </div>
        <p class="inv-cap">I diagrammet visas blandplaceringar fördelat på aktier, räntor och alternativa placeringar. Ränteplaceringar inkluderar även de pengar du har på kontot.</p>
      </div>
    </div>`;
}

function openAccount(id){
  const a = accounts[id];
  document.getElementById('loading-title').textContent = a.name;
  show('view-loading');

  const topTitle = document.getElementById('detail-topbar-title');
  const payWrap = document.getElementById('paybtn-wrap');
  const topRight = document.getElementById('detail-topbar-right');

  setTimeout(()=>{
    if(a.invest){
      topTitle.textContent = 'Investering';
      payWrap.style.display = 'none';
      topRight.className = 'topbar-right on';
      topRight.innerHTML = `
        <span class="bell"><svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg><span class="bell-badge">14</span></span>
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>`;
      document.getElementById('detail-scroll').innerHTML = investHTML(a);
      document.getElementById('detail-scroll').scrollTop = 0;
      show('view-detail');
      return;
    }
    topTitle.textContent = '';
    payWrap.style.display = '';
    topRight.className = 'topbar-right';
    topRight.innerHTML = '';

    let html = `
      <div class="detail-head">
        <h1>${a.name}</h1>
        <div class="lbl">Tillgängligt belopp</div>
        <div class="big">${a.amount} kr</div>
        <div class="lbl">Clearing- och kontonummer</div>
        <div class="num">${a.no}</div>
      </div>
      <div class="detail-sep"></div>
      <div class="link-row">Kontoinformation ${chev}</div>
      <div class="link-row">Hantera konto ${chev}</div>
      <div class="detail-sep"></div>`;

    if(a.reserved.length){
      html += `<div class="sec-h">Reserverade belopp</div>` + a.reserved.map(txRow).join('');
    }
    if(a.months.length){
      a.months.forEach(m=>{
        html += `<div class="sec-h">${m.label}</div>` + m.tx.map(txRow).join('');
      });
    }
    if(!a.reserved.length && !a.months.length){
      html += `<div class="empty">Inga transaktioner att visa ännu.</div>`;
    }

    document.getElementById('detail-scroll').innerHTML = html;
    document.getElementById('detail-scroll').scrollTop = 0;
    show('view-detail');
  }, 500);
}
</script>
</body>
</html>
