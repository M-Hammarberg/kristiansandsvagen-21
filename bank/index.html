<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Swedbank</title>
<style>
  :root{
    --bg:#0e0e0f; --card:#1c1c1e; --divider:#39393b;
    --teal-circle:#1d4c57; --teal-icon:#79b6c2; --teal-pill:#1d4c57; --teal-pill-text:#7fbccb;
    --orange:#ef5f24; --orange-card1:#f26a26; --orange-card2:#e9531a; --oak:#c9430f;
    --text:#f4f4f5; --text-dim:#8a8a8e; --nav-inactive:#c9c9cc;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#000;height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;justify-content:center;color:var(--text);-webkit-font-smoothing:antialiased;}

  .phone{width:100%;max-width:400px;height:100%;background:var(--bg);position:relative;overflow:hidden}
  .view{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg)}
  .view.hidden{display:none}
  .scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .wave{position:absolute;top:0;left:0;width:100%;height:170px;z-index:0;pointer-events:none}
  .content{position:relative;z-index:1;padding-bottom:12px}

  /* frosted translucent top that fades in on scroll */
  .topglass{position:absolute;top:0;left:0;right:0;height:78px;z-index:5;pointer-events:none;opacity:0;transition:opacity .12s linear;background:linear-gradient(to bottom,rgba(14,14,15,.82) 45%,rgba(14,14,15,0));-webkit-backdrop-filter:blur(11px);backdrop-filter:blur(11px);-webkit-mask-image:linear-gradient(to bottom,#000 55%,transparent);mask-image:linear-gradient(to bottom,#000 55%,transparent)}

  .bankid{padding:12px 18px 2px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:2px;color:#fff}

  .actions{display:flex;justify-content:center;gap:24px;padding:22px 16px 14px}
  .action{display:flex;flex-direction:column;align-items:center;gap:10px;width:76px;cursor:pointer}
  .action .circle{width:72px;height:72px;border-radius:50%;background:var(--teal-circle);display:flex;align-items:center;justify-content:center}
  .action .label{font-size:13px;font-weight:600;text-align:center;line-height:1.25}

  .heading{display:flex;align-items:center;gap:5px;color:var(--orange);font-size:23px;font-weight:800;padding:12px 18px 8px}

  .accounts{margin:0 14px;background:var(--card);border-radius:15px;padding:2px 16px}
  .acc-row{display:flex;align-items:center;justify-content:space-between;padding:13px 0;cursor:pointer}
  .acc-row + .acc-row{border-top:1px solid var(--divider)}
  .acc-row:active{opacity:.55}
  .acc-left .name{font-size:17px;font-weight:700;margin-bottom:4px}
  .acc-left .no{font-size:13px;color:var(--text-dim);font-weight:500}
  .acc-right{display:flex;align-items:center;gap:10px}
  .acc-right .amount{font-size:17px;font-weight:800}
  .chev{color:#6a6a6e;display:flex}

  .snabb-wrap{display:flex;justify-content:flex-end;padding:12px 14px 6px}
  .snabb{background:var(--teal-pill);color:var(--teal-pill-text);border:none;font-size:16px;font-weight:700;padding:11px 20px;border-radius:20px}

  .card-wrap{display:flex;justify-content:center;padding:4px 0}

  .bankcard .seam{position:absolute;top:0;right:60px;width:1px;height:100%;background:rgba(0,0,0,.12)}
  .bankcard .oak{position:absolute;left:50%;transform:translateX(-50%);bottom:0;width:216px;height:178px;opacity:.92}
  .bankcard .debit{position:absolute;top:16px;left:20px;font-size:15px;font-weight:600;color:#ffd9c4}
  .bankcard .chip{position:absolute;top:60px;left:22px}
  .bankcard .contact{position:absolute;top:66px;left:78px}
  .bankcard .mc{position:absolute;bottom:16px;right:20px;display:flex}
  .mc .mc-c{width:34px;height:34px;border-radius:50%}
  .mc .red{background:#eb2f36}
  .mc .yellow{background:#f4901e;margin-left:-14px;mix-blend-mode:screen}

  .peek{color:var(--orange);font-size:23px;font-weight:800;padding:16px 18px 0;opacity:.85;display:flex;align-items:center;gap:5px}

  .nav{display:flex;align-items:center;justify-content:space-between;margin:0 12px 12px;padding:6px 16px;background:#161617;border:1px solid #262628;border-radius:28px}
  .nav-top{margin-top:14px}
  .nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;position:relative}
  .nav-item.active{color:var(--orange)}
  .nav-item.inactive{color:var(--nav-inactive)}
  .nav-item.active .pill{background:#3a2a1c;border-radius:18px;padding:6px 16px;margin-bottom:-4px}
  .nav-item .icowrap{padding:6px 0}
  .badge{position:absolute;top:-2px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--orange)}

  .backbtn{width:50px;height:50px;border-radius:50%;background:#2a2a2c;display:flex;align-items:center;justify-content:center;margin:10px 0 4px 18px;cursor:pointer;border:none}
  .backbtn:active{opacity:.6}

  .loading-center{flex:1;display:flex;align-items:center;justify-content:center}
  .spinner{width:38px;height:38px;border-radius:50%;border:4px solid transparent;border-left-color:var(--orange);animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  .detail-head{padding:0 18px}
  .detail-head h1{color:var(--orange);font-size:28px;font-weight:800;margin-bottom:16px}
  .lbl{color:var(--text-dim);font-size:15px;margin-bottom:2px}
  .big{font-size:23px;font-weight:800;margin-bottom:16px}
  .num{font-size:18px;font-weight:600;margin-bottom:16px}
  .detail-sep{height:1px;background:var(--divider);margin:2px 18px}
  .link-row{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;font-size:18px;cursor:pointer}
  .link-row + .link-row{border-top:1px solid var(--divider)}
  .sec-h{color:var(--orange);font-size:23px;font-weight:800;padding:20px 18px 6px}
  .tx{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;cursor:pointer}
  .tx + .tx{border-top:1px solid var(--divider)}
  .tx .t-name{font-size:17px;font-weight:600;margin-bottom:5px;max-width:70%}
  .tx .t-date{font-size:13px;color:var(--text-dim)}
  .tx .t-right{display:flex;align-items:center;gap:10px}
  .tx .t-amt{font-size:17px;font-weight:700;white-space:nowrap}
  .empty{color:var(--text-dim);text-align:center;font-size:16px;padding:46px 26px}
  .paybtn-wrap{position:relative;padding:0 14px}
  .paybtn{position:absolute;left:14px;right:14px;bottom:8px;background:var(--orange);color:#fff;border:none;font-size:18px;font-weight:800;padding:16px;border-radius:28px;box-shadow:0 6px 20px rgba(0,0,0,.4);cursor:pointer}
  .list-pad{padding-bottom:56px}

  .detail-topbar{position:relative;display:flex;align-items:center}
  .detail-topbar .backbtn{margin:10px 0 10px 18px}
  .topbar-title{position:absolute;left:64px;right:64px;top:50%;transform:translateY(-50%);text-align:center;font-size:19px;font-weight:600}

  .inv{--pie-red:#e8552a;--pie-yellow:#f2c94c;--pie-teal:#3e8ba0;--pos:#5a9fd4}
  .inv-search{display:flex;align-items:center;gap:10px;margin:4px 14px;background:#242426;border-radius:13px;padding:12px 14px;color:#8a8a8e;font-size:15px}
  .inv-stats{display:grid;grid-template-columns:1fr 1fr 1fr;padding:16px 6px 6px;text-align:center;column-gap:2px}
  .inv-stats .s-lbl{color:#c9c9cc;font-size:12px}
  .inv-stats .s-val{font-size:16px;font-weight:800;margin:5px 0 12px;white-space:nowrap}
  .inv-stats .s-lbl2{color:#c9c9cc;font-size:12px}
  .inv-stats .s-val2{font-size:16px;font-weight:800;margin-top:5px;white-space:nowrap}
  .inv-stats .pos{color:var(--pos)}
  .inv-row{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;font-size:18px}
  .inv-row .play{color:#a97b7b}
  .inv-deposit{display:flex;align-items:center;gap:13px;padding:16px 18px 6px}
  .dep-plus{width:36px;height:36px;border-radius:50%;background:var(--teal-circle);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .dep-link{color:#7fbccb;font-size:18px;font-weight:700;text-decoration:underline}
  .inv-h{font-size:24px;font-weight:800;padding:18px 18px 10px}
  .inv-card{margin:0 14px;background:var(--card);border-radius:11px;padding:20px 16px}
  .inv-chart{display:flex;align-items:center;gap:16px}
  .pie{width:118px;height:118px;border-radius:50%;flex:0 0 auto}
  .legend{display:flex;flex-direction:column;gap:12px;font-size:16px;line-height:1.25}
  .legend .dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:9px;vertical-align:middle}
  .legend .red{background:var(--pie-red)}
  .legend .yellow{background:var(--pie-yellow)}
  .legend .teal{background:var(--pie-teal)}
  .inv-cap{color:#8a8a8e;font-size:13px;line-height:1.4;margin-top:18px}

  .topbar-right{margin-left:auto;display:none;align-items:center;gap:14px;padding-right:18px}
  .topbar-right.on{display:flex}
  .bell{position:relative}
  .bell-badge{position:absolute;top:-7px;right:-9px;background:#c9a84a;color:#1a1a1a;font-size:12px;font-weight:700;min-width:20px;height:20px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 4px}

  .up{font-size:.85em;font-weight:700}

  .aktier-head{display:flex;justify-content:space-between;align-items:center;background:#161617;padding:12px 18px;color:#8a8a8e;font-size:15px}
  .hold{position:relative;padding:14px 18px;border-bottom:1px solid var(--divider)}
  .hold-name{display:flex;align-items:center;gap:7px;font-size:17px;font-weight:600;margin-bottom:12px}
  .flag{width:21px;height:14px;border-radius:2px;overflow:hidden;flex:0 0 auto;display:block}
  .tick{background:#6b6a2e;color:#fff;font-weight:700;padding:2px 8px;border-radius:4px;font-size:15px}
  .hold-grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;padding-right:22px;column-gap:5px}
  .hg-l{color:#8a8a8e;font-size:12px;margin-bottom:6px}
  .hg-v{font-size:15px;font-weight:600;white-space:nowrap}
  .hg.right{text-align:right}
  .hold-chev{position:absolute;right:14px;top:62%;color:#8a8a8e;display:flex}
  .pos{color:#5a9fd4}
</style>
</head>
<body>
<div class="phone">

<!-- ============ START VIEW ============ -->
<div class="view" id="view-start">
  <div class="scroll" id="start-scroll">
    <svg class="wave" viewBox="0 0 430 230" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M0,0 L430,0 L430,120 C380,150 350,80 300,110 C250,140 210,70 160,105 C110,140 70,95 0,140 Z" fill="#040405"/>
    </svg>
    <div class="content">
      <div class="bankid"><svg width="12" height="16" viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 1L4 8l7 7"/></svg>BankID</div>

      <div class="actions">
        <div class="action"><div class="circle"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--teal-icon)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5l1.5 1.5L8 5.5"/><line x1="11" y1="6.5" x2="20" y2="6.5"/><circle cx="5.5" cy="16" r="1.8"/><line x1="11" y1="16" x2="20" y2="16"/></svg></div><div class="label">Att göra</div></div>
        <div class="action"><div class="circle"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--teal-icon)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8.5h13l-3-3"/><path d="M19 15.5H6l3 3"/></svg></div><div class="label">Betala och<br>överföra</div></div>
        <div class="action"><div class="circle"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="var(--teal-icon)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4"/><line x1="9.5" y1="12" x2="15" y2="12"/><line x1="9.5" y1="15" x2="15" y2="15"/></svg></div><div class="label">E-fakturor</div></div>
      </div>

      <div class="heading">Konton <svg width="13" height="20" viewBox="0 0 12 20" fill="none" stroke="var(--orange)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2 2l7 8-7 8"/></svg></div>

      <div class="accounts" id="acc-list"></div>

      <div class="snabb-wrap"><button class="snabb">Snabböverför</button></div>

      <div class="heading">Kort <svg width="13" height="20" viewBox="0 0 12 20" fill="none" stroke="var(--orange)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2 2l7 8-7 8"/></svg></div>
      <div class="card-wrap">
        <div class="bankcard"></div>
      </div>
      <div class="peek">Transaktioner <svg width="13" height="20" viewBox="0 0 12 20" fill="none" stroke="var(--orange)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2 2l7 8-7 8"/></svg></div>
    </div>
  </div>
  <div class="topglass" id="startGlass"></div>
  <div id="nav-start"></div>
</div>

<!-- ============ LOADING VIEW ============ -->
<div class="view hidden" id="view-loading">
  <button class="backbtn"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
  <div class="detail-head"><h1 id="loading-title" style="font-size:28px;color:var(--orange);font-weight:800;margin-bottom:0">Privatkonto</h1></div>
  <div class="loading-center"><div class="spinner"></div></div>
  <div id="nav-loading"></div>
</div>

<!-- ============ DETAIL VIEW ============ -->
<div class="view hidden" id="view-detail">
  <div class="detail-topbar">
    <button class="backbtn" onclick="goHome()"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="topbar-title" id="detail-topbar-title"></div>
    <div class="topbar-right" id="detail-topbar-right"></div>
  </div>
  <div class="scroll list-pad" id="detail-scroll"></div>
  <div class="paybtn-wrap" id="paybtn-wrap" style="height:0"><button class="paybtn">Ny betalning/överföring</button></div>
  <div id="nav-detail"></div>
</div>

</div>

<script>
const navHTML = `
<div class="nav nav-top">
  <div class="nav-item active"><div class="pill"><svg width="21" height="21" viewBox="0 0 24 24" fill="var(--orange)"><path d="M12 3l9 8h-2.5v9h-4v-6h-5v6h-4v-9H3z"/></svg></div>Start</div>
  <div class="nav-item inactive"><div class="icowrap"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 15l5-6 4 3 6-8"/><path d="M15 4h4v4"/></svg></div>Din ekonomi</div>
  <div class="nav-item inactive"><div class="icowrap"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-4 4z"/></svg></div>Hjälp</div>
  <div class="nav-item inactive"><span class="badge"></span><div class="icowrap"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-7 8-7s8 3 8 7"/></svg></div>Du</div>
</div>`;
['nav-start','nav-loading','nav-detail'].forEach(id=>document.getElementById(id).innerHTML=navHTML);

const chev = `<svg class="chev" width="14" height="24" viewBox="0 0 12 20" fill="none" stroke="#8a8a8e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 2l7 8-7 8"/></svg>`;

const accounts = {
  kort:   {name:"Kortkonto",     amount:"843,17",    no:"8327-9,417 062 883-1",
    reserved:[
      {n:"CLAS OHLSON TROLLHÄTTAN", d:"2026-09-26", a:"−403,80"},
      {n:"SYSTEMBOLAGET TROLLHÄTTAN", d:"2026-09-26", a:"−267,40"},
      {n:"EASYPARK EASYPARK.SE", d:"2026-09-26", a:"−19,75"},
      {n:"PINO & SAL AB TROLLHÄTTAN", d:"2026-09-25", a:"−129,00"}
    ],
    months:[{label:"september 2026", tx:[
      {n:"Övf via internet 8327912345678", d:"2026-09-25", a:"1 000,00"},
      {n:"OKQ8", d:"2026-09-24", a:"−58,00"},
      {n:"Netflix.com", d:"2026-09-24", a:"−169,00"},
      {n:"KRUBBSTUGAN", d:"2026-09-23", a:"−139,00"},
      {n:"RESTAURANG TERAS", d:"2026-09-22", a:"−212,00"},
      {n:"VIP MULLSJÖ", d:"2026-09-21", a:"−95,00"},
      {n:"EasyPark", d:"2026-09-20", a:"−13,33"},
      {n:"ICA NÄRA TROLLHÄTTAN", d:"2026-09-19", a:"−247,60"},
      {n:"Spotify", d:"2026-09-18", a:"−119,00"}
    ]}]},
  privat: {name:"Privatkonto",   amount:"18 447,92", no:"8327-9,205 774 619-4",
    reserved:[{n:"ICA KVANTUM", d:"2026-09-25", a:"−412,80"}],
    months:[{label:"september 2026", tx:[
      {n:"Netflix", d:"2026-09-25", a:"−169,00"},
      {n:"Max Burgers", d:"2026-09-25", a:"−142,00"},
      {n:"ICA KVANTUM", d:"2026-09-23", a:"−673,45"},
      {n:"Coop", d:"2026-09-22", a:"−238,90"},
      {n:"Vattenfall", d:"2026-09-20", a:"−412,17"},
      {n:"Apotek Hjärtat", d:"2026-09-16", a:"−134,50"},
      {n:"Övf via internet 8327998765432", d:"2026-09-12", a:"2 500,00"},
      {n:"Willys", d:"2026-09-11", a:"−523,40"},
      {n:"Spotify", d:"2026-09-18", a:"−119,00"}
    ]}]},
  lon:    {name:"1. Lönekonto",  amount:"24 863,40", no:"8327-9,662 138 507-2",
    reserved:[],
    months:[{label:"september 2026", tx:[
      {n:"LÖN", d:"2026-09-25", a:"34 500,00"},
      {n:"Övf till sparkonto", d:"2026-09-25", a:"−8 000,00"},
      {n:"ICA KVANTUM", d:"2026-09-19", a:"−842,15"},
      {n:"Swish", d:"2026-09-12", a:"−300,00"},
      {n:"H&M", d:"2026-09-08", a:"−498,00"},
      {n:"ELRÄKNING VATTENFALL", d:"2026-09-05", a:"−689,00"},
      {n:"HYRA BOSTAD", d:"2026-09-01", a:"−7 450,00"}
    ]}]},
  csn:    {name:"Investering ISK", amount:"2 365 408,11", no:"8327-9,509 341 276-8", invest:true,
    handla:"24 817,60", inkop:"483 321,00", total:"2 365 408,11",
    utv:"+1 857 269,51", utvpct:"+384,27",
    aktierTotal:"2 340 590,51",
    holdings:[
      {flag:"us", tick:"SNDK", name:"SanDisk B",           idag:"+11,84", senast:"1 777,80", sedan:"+536,38", varde:"912 840,20"},
      {flag:"us", tick:"MRNA", name:"Moderna",             idag:"+4,21",  senast:"198,88",   sedan:"+399,06", varde:"623 410,15"},
      {flag:"us", tick:"DELL", name:"Dell Technologies",   idag:"+2,03",  senast:"171,45",   sedan:"+305,85", varde:"498 220,66"},
      {flag:"us", tick:"MU",   name:"Micron Technology",   idag:"+3,10",  senast:"245,60",   sedan:"+224,84", varde:"306 119,50"}
    ],
    alloc:{aktier:100, rantor:0, alt:0}, reserved:[], months:[]}
};

// build account list
const accList = document.getElementById('acc-list');
accList.innerHTML = Object.entries(accounts).map(([id,a])=>`
  <div class="acc-row" onclick="openAccount('${id}')">
    <div class="acc-left"><div class="name">${a.name}</div><div class="no">${a.no}</div></div>
    <div class="acc-right"><div class="amount">${a.amount}</div>${chev}</div>
  </div>`).join('');

function show(id){
  ['view-start','view-loading','view-detail'].forEach(v=>document.getElementById(v).classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
}
function goHome(){ show('view-start'); }

function txRow(t){
  return `<div class="tx"><div><div class="t-name">${t.n}</div><div class="t-date">${t.d}</div></div>
    <div class="t-right"><div class="t-amt">${t.a}</div>${chev}</div></div>`;
}

const flagSVG = {
  us:`<svg class="flag" viewBox="0 0 20 13" preserveAspectRatio="none"><rect width="20" height="13" fill="#fff"/><g fill="#b22234"><rect y="0" width="20" height="1.85"/><rect y="3.7" width="20" height="1.85"/><rect y="7.4" width="20" height="1.85"/><rect y="11.1" width="20" height="1.9"/></g><rect width="9" height="7" fill="#3c3b6e"/></svg>`,
  se:`<svg class="flag" viewBox="0 0 16 10" preserveAspectRatio="none"><rect width="16" height="10" fill="#006aa7"/><rect x="5" width="2" height="10" fill="#fecc00"/><rect y="4" width="16" height="2" fill="#fecc00"/></svg>`
};
const up = `\u00A0<span class="up">↗</span>`;
const chevSm = `<svg width="11" height="19" viewBox="0 0 12 20" fill="none" stroke="#8a8a8e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 2l7 8-7 8"/></svg>`;

function holdRow(h){
  return `<div class="hold">
    <div class="hold-name">${flagSVG[h.flag]||''}<span class="tick">${h.tick}</span> ${h.name}</div>
    <div class="hold-grid">
      <div class="hg"><div class="hg-l">Idag %</div><div class="hg-v pos">${h.idag}${up}</div></div>
      <div class="hg"><div class="hg-l">Senast</div><div class="hg-v">${h.senast}</div></div>
      <div class="hg"><div class="hg-l">Sedan köp %</div><div class="hg-v pos">${h.sedan}${up}</div></div>
      <div class="hg right"><div class="hg-l">Värde</div><div class="hg-v">${h.varde}</div></div>
    </div>
    <div class="hold-chev">${chevSm}</div>
  </div>`;
}

function investHTML(a){
  const al = a.alloc;
  const p1 = al.aktier, p2 = al.aktier + al.rantor;
  const pie = `background:conic-gradient(var(--pie-red) 0% ${al.aktier}%, var(--pie-yellow) ${p1}% ${p2}%, var(--pie-teal) ${p2}% 100%)`;
  const play = `<svg class="play" width="15" height="17" viewBox="0 0 12 14" fill="currentColor"><path d="M0 0l12 7-12 7z"/></svg>`;
  return `
    <div class="inv">
      <div class="inv-search">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8a8a8e" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
        Sök aktier och fonder
      </div>

      <div class="inv-stats">
        <div class="col">
          <div class="s-lbl">Att handla för</div><div class="s-val">${a.handla}</div>
          <div class="s-lbl2">Inköpsvärde</div><div class="s-val2">${a.inkop}</div>
        </div>
        <div class="col">
          <div class="s-lbl">Utv. sedan köp</div><div class="s-val pos">${a.utv}${up}</div>
          <div class="s-lbl2">Utv. sedan köp %</div><div class="s-val2 pos">${a.utvpct}${up}</div>
        </div>
        <div class="col">
          <div class="s-lbl">Totalt värde</div><div class="s-val">${a.total}</div>
        </div>
      </div>

      <div class="detail-sep"></div>
      <div class="inv-row"><span>Dina ordrar</span>${play}</div>
      <div class="detail-sep"></div>
      <div class="inv-row"><span>Månadssparande</span>${play}</div>
      <div class="detail-sep"></div>

      <div class="inv-deposit">
        <span class="dep-plus"><svg width="18" height="18" viewBox="0 0 24 24" stroke="#7fbccb" stroke-width="2.4" stroke-linecap="round"><line x1="12" y1="6" x2="12" y2="18"/><line x1="6" y1="12" x2="18" y2="12"/></svg></span>
        <span class="dep-link">Sätt in pengar</span>
      </div>

      <div class="aktier-head"><span>Aktier</span><span>${a.aktierTotal}</span></div>
      ${a.holdings.map(holdRow).join('')}

      <h2 class="inv-h">Tillgångsfördelning</h2>
      <div class="inv-card">
        <div class="inv-chart">
          <div class="pie" style="${pie}"></div>
          <div class="legend">
            <div><span class="dot red"></span>Aktieplaceringar<br>${al.aktier} %</div>
            <div><span class="dot yellow"></span>Ränteplaceringar<br>${al.rantor} %</div>
            <div><span class="dot teal"></span>Alternativa placeringar<br>${al.alt} %</div>
          </div>
        </div>
        <p class="inv-cap">I diagrammet visas blandplaceringar fördelat på aktier, räntor och alternativa placeringar. Ränteplaceringar inkluderar även de pengar du har på kontot.</p>
      </div>
    </div>`;
}

function openAccount(id){
  const a = accounts[id];
  document.getElementById('loading-title').textContent = a.name;
  show('view-loading');

  const topTitle = document.getElementById('detail-topbar-title');
  const payWrap = document.getElementById('paybtn-wrap');
  const topRight = document.getElementById('detail-topbar-right');

  setTimeout(()=>{
    if(a.invest){
      topTitle.textContent = 'Investering';
      payWrap.style.display = 'none';
      topRight.className = 'topbar-right on';
      topRight.innerHTML = `
        <span class="bell"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg><span class="bell-badge">14</span></span>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>`;
      document.getElementById('detail-scroll').innerHTML = investHTML(a);
      document.getElementById('detail-scroll').scrollTop = 0;
      show('view-detail');
      return;
    }
    topTitle.textContent = '';
    payWrap.style.display = '';
    topRight.className = 'topbar-right';
    topRight.innerHTML = '';

    let html = `
      <div class="detail-head">
        <h1>${a.name}</h1>
        <div class="lbl">Tillgängligt belopp</div>
        <div class="big">${a.amount} kr</div>
        <div class="lbl">Clearing- och kontonummer</div>
        <div class="num">${a.no}</div>
      </div>
      <div class="detail-sep"></div>
      <div class="link-row">Kontoinformation ${chev}</div>
      <div class="link-row">Hantera konto ${chev}</div>
      <div class="detail-sep"></div>`;

    if(a.reserved.length){
      html += `<div class="sec-h">Reserverade belopp</div>` + a.reserved.map(txRow).join('');
    }
    if(a.months.length){
      a.months.forEach(m=>{
        html += `<div class="sec-h">${m.label}</div>` + m.tx.map(txRow).join('');
      });
    }
    if(!a.reserved.length && !a.months.length){
      html += `<div class="empty">Inga transaktioner att visa ännu.</div>`;
    }

    document.getElementById('detail-scroll').innerHTML = html;
    document.getElementById('detail-scroll').scrollTop = 0;
    show('view-detail');
  }, 500);
}

// fade the frosted top in as the start page scrolls
(function(){
  const sc = document.getElementById('start-scroll');
  const g = document.getElementById('startGlass');
  if(sc && g){
    sc.addEventListener('scroll', ()=>{ g.style.opacity = Math.min(sc.scrollTop/45, 1); }, {passive:true});
  }
})();
</script>
</body>
</html>
